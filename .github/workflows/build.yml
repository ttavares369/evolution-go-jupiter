name: Build and Publish Evolution GO Jupiter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ttavares369/evolution-go-jupiter

jobs:
  docker:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.arch }}

  manifest:
    name: Publish and verify multi-platform image
    needs: docker
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish a new multi-platform tag without touching production tags
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:0.7.2-jupiter2-webhook-${COMMIT_SHA}" \
            "${IMAGE}:sha-${COMMIT_SHA}-amd64" \
            "${IMAGE}:sha-${COMMIT_SHA}-arm64"

      - name: Verify published architectures
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:0.7.2-jupiter2-webhook-${COMMIT_SHA}" --raw |
            jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | unique == ["amd64", "arm64"]'
