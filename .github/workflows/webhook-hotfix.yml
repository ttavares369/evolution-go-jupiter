name: Build Evolution Go authenticated webhook connection hotfix

on:
  push:
    branches: [fix/webhook-client-outdated-405]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ttavares369/evolution-go-jupiter

jobs:
  docker:
    name: Test and build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.webhook-hotfix
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:webhook-wa405-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=wa405-${{ matrix.arch }}

  manifest:
    name: Publish and verify authenticated webhook image
    needs: docker
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only the new hotfix tag
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          TAG="0.7.2-jupiter2-webhook-wa405-${COMMIT_SHA:0:12}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            "${IMAGE}:webhook-wa405-${COMMIT_SHA}-amd64" \
            "${IMAGE}:webhook-wa405-${COMMIT_SHA}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${TAG}" --raw |
            jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | unique == ["amd64", "arm64"]'
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
          printf 'Image: `%s:%s`\n' "$IMAGE" "$TAG" >> "$GITHUB_STEP_SUMMARY"
